<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BhoomiSetu - Property Details</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f8f5;
    color:#183b27;
}

header{
    background:#145a32;
    color:white;
    padding:15px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:25px;
    font-weight:bold;
}

.logo img{
    width:55px;
    height:55px;
    object-fit:contain;
    background:white;
    border-radius:8px;
}

nav{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:35px auto;
    padding:0 18px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#145a32;
    text-decoration:none;
    font-weight:bold;
}

.property{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.gallery{
    background:#eee;
}

.main-image{
    width:100%;
    height:480px;
    object-fit:cover;
    display:block;
}

.thumbnails{
    display:flex;
    gap:10px;
    padding:12px;
    overflow-x:auto;
}

.thumbnail{
    width:90px;
    height:70px;
    object-fit:cover;
    border-radius:8px;
    cursor:pointer;
    border:2px solid transparent;
}

.thumbnail:hover{
    border-color:#d4a72c;
}

.content{
    padding:28px;
}

.approved{
    display:inline-block;
    background:#237a45;
    color:white;
    padding:7px 13px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:12px;
}

h1{
    margin:0 0 10px;
    font-size:32px;
}

.location{
    color:#555;
    font-size:17px;
    margin-bottom:20px;
}

.price{
    color:#145a32;
    font-size:30px;
    font-weight:bold;
    margin:20px 0;
}

.details{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin:25px 0;
}

.detail{
    background:#f3f7f3;
    padding:16px;
    border-radius:10px;
}

.detail span{
    display:block;
    color:#666;
    font-size:13px;
    margin-bottom:5px;
}

.detail strong{
    font-size:16px;
}

.description{
    color:#555;
    line-height:1.7;
    margin:25px 0;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:25px;
}

.buttons a{
    text-align:center;
    text-decoration:none;
    padding:15px;
    border-radius:9px;
    font-weight:bold;
}

.maps{
    background:#e8f3ea;
    color:#145a32;
}

.whatsapp{
    background:#25d366;
    color:white;
}

.sitevisit{
    background:#d4a72c;
    color:white;
    grid-column:1/-1;
}

.video-section{
    margin-top:30px;
}

.video-section h2{
    margin-bottom:15px;
}

video{
    width:100%;
    max-height:550px;
    border-radius:12px;
    background:#000;
}

.disclaimer{
    margin-top:30px;
    padding:18px;
    background:#fff8e5;
    border-left:5px solid #d4a72c;
    color:#555;
    line-height:1.6;
    border-radius:8px;
}

.loading,
.error{
    text-align:center;
    padding:60px 20px;
    background:white;
    border-radius:12px;
}

footer{
    margin-top:60px;
    background:#123d24;
    color:white;
    text-align:center;
    padding:30px 20px;
}

@media(max-width:600px){

    .main-image{
        height:300px;
    }

    h1{
        font-size:25px;
    }

    .content{
        padding:20px;
    }

    .details{
        grid-template-columns:1fr;
    }

    .buttons{
        grid-template-columns:1fr;
    }

    .sitevisit{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <img src="Logo.PNG" alt="BhoomiSetu">
        <span>BhoomiSetu</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="buy.html">Buy Land</a>
        <a href="list-property.html">Sell Land</a>
        <a href="index.html#contact">Contact</a>
    </nav>

</header>


<div class="container">

    <a href="buy.html" class="back">
        ← Back to Buy Land
    </a>

    <div id="propertyContainer">

        <div class="loading">
            Loading property details...
        </div>

    </div>

</div>


<footer>

    <h3>BhoomiSetu</h3>

    <p>A Brighter Tomorrow Together</p>

    <p>📞 9391569352</p>

    <p>📧 bhoomisetu14@gmail.com</p>

    <p>
        Devi Gandhi Plaza, Near Kadthal Toll Gate,
        Kadthal, Ranga Reddy District,
        Telangana - 509358
    </p>

</footer>


<script>

const SUPABASE_URL =
"https://vaqzzxkfcawasufavmxn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_F-vFp9fHz3_MbD3lz2oYTQ_-Ah28nsX";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* GET PROPERTY ID FROM URL */

const params =
new URLSearchParams(window.location.search);

const propertyId =
params.get("id");


/* LOAD PROPERTY */

async function loadProperty(){

    const container =
        document.getElementById("propertyContainer");

    if(!propertyId){

        container.innerHTML =
        `
        <div class="error">
            <h2>Property Not Found</h2>
            <p>No property ID was provided.</p>
            <a href="buy.html">← Back to Buy Land</a>
        </div>
        `;

        return;
    }


    const { data, error } =
    await supabaseClient
    .from("public_properties")
    .select("*")
    .eq("id", propertyId)
    .maybeSingle();


    if(error || !data){

        console.error(error);

        container.innerHTML =
        `
        <div class="error">
            <h2>Property Not Found</h2>
            <p>This property may no longer be available.</p>
            <a href="buy.html">← Back to Buy Land</a>
        </div>
        `;

        return;
    }


    displayProperty(data);

}


/* DISPLAY PROPERTY */

function displayProperty(property){

    const container =
        document.getElementById("propertyContainer");


    let photos = [];

    if(property.photo_urls){

        if(Array.isArray(property.photo_urls)){

            photos = property.photo_urls;

        }else{

            try{

                const parsed =
                    JSON.parse(property.photo_urls);

                if(Array.isArray(parsed)){
                    photos = parsed;
                }

            }catch(e){

                photos = [];
            }

        }

    }


    let mainPhoto =
        photos.length > 0
        ? photos[0]
        : "";


    let thumbnails = "";

    photos.forEach((photo,index)=>{

        thumbnails +=
        `
        <img
            class="thumbnail"
            src="${photo}"
            alt="Property Photo"
            onclick="changeMainImage('${photo}')"
        >
        `;

    });


    let mapButton = "";

    if(property.google_maps){

        mapButton =
        `
        <a
            class="maps"
            href="${property.google_maps}"
            target="_blank"
        >
            📍 Open Google Maps
        </a>
        `;

    }


    const whatsappMessage =
        encodeURIComponent(
            "Hi BhoomiSetu, I am interested in this property. Property ID: " +
            property.id
        );


    const siteVisitMessage =
        encodeURIComponent(
            "Hi BhoomiSetu, I want to schedule a site visit for Property ID: " +
            property.id
        );


    let videoSection = "";

    if(property.video_url){

        videoSection =
        `
        <div class="video-section">

            <h2>🎥 Property Video</h2>

            <video controls preload="metadata">
                <source
                    src="${property.video_url}"
                    type="video/mp4"
                >
                Your browser does not support video playback.
            </video>

        </div>
        `;

    }


    container.innerHTML =
    `
    <div class="property">

        <div class="gallery">

            ${
                mainPhoto
                ?
                `
                <img
                    id="mainImage"
                    class="main-image"
                    src="${mainPhoto}"
                    alt="Property Photo"
                >
                `
                :
                `
                <div
                    class="main-image"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:#777;
                    "
                >
                    No Property Image
                </div>
                `
            }


            ${
                photos.length > 1
                ?
                `
                <div class="thumbnails">
                    ${thumbnails}
                </div>
                `
                :
                ""
            }

        </div>


        <div class="content">

            <div class="approved">
                ✓ Approved Property
            </div>


            <h1>
                ${property.property_type || "Land Property"}
            </h1>


            <div class="location">
                📍
                ${property.village || ""},
                ${property.mandal || ""},
                ${property.district || ""}
            </div>


            <div class="price">
                ₹ ${property.expected_price || "Price on Request"}
            </div>


            <div class="details">

                <div class="detail">
                    <span>🆔 Property ID</span>
                    <strong>${property.id}</strong>
                </div>

                <div class="detail">
                    <span>📐 Land Size</span>
                    <strong>${property.land_size || "-"}</strong>
                </div>

                <div class="detail">
                    <span>🌾 Property Type</span>
                    <strong>${property.property_type || "-"}</strong>
                </div>

                <div class="detail">
                    <span>🛣️ Road Access</span>
                    <strong>${property.road_access || "-"}</strong>
                </div>

                <div class="detail">
                    <span>📍 District</span>
                    <strong>${property.district || "-"}</strong>
                </div>

                <div class="detail">
                    <span>📍 Mandal</span>
                    <strong>${property.mandal || "-"}</strong>
                </div>

                <div class="detail">
                    <span>📍 Village</span>
                    <strong>${property.village || "-"}</strong>
                </div>

            </div>


            ${
                property.description
                ?
                `
                <div class="description">
                    <h2>Property Description</h2>
                    ${property.description}
                </div>
                `
                :
                ""
            }


            <div class="buttons">

                ${mapButton}


                <a
                    class="whatsapp"
                    href="https://wa.me/919391569352?text=${whatsappMessage}"
                    target="_blank"
                >
                    💬 Enquire on WhatsApp
                </a>


                <a
                    class="sitevisit"
                    href="https://wa.me/919391569352?text=${siteVisitMessage}"
                    target="_blank"
                >
                    📅 Schedule Site Visit
                </a>

            </div>


            ${videoSection}


            <div class="disclaimer">

                <b>⚠️ Important Property Information</b>

                <br><br>

                This property listing is provided for
                information and enquiry purposes only.
                Property documents, title, ownership,
                measurements, permissions and other legal
                matters should be independently verified
                before making any payment or entering into
                any agreement.

                <br><br>

                BhoomiSetu does not guarantee title,
                ownership or legal clearance unless
                specifically stated as professionally
                verified.

            </div>

        </div>

    </div>
    `;

}


/* CHANGE MAIN IMAGE */

function changeMainImage(photo){

    const image =
        document.getElementById("mainImage");

    if(image){

        image.src = photo;

    }

}


/* START */

loadProperty();

</script>

</body>
</html>
